<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Change password')}"></head>
<body>
<div th:replace="~{fragments :: nav('')}"></div>
<main class="page" style="max-width:560px">
  <div class="crumb"><a class="back-btn" th:href="@{/}"><svg th:replace="~{fragments :: icon('arrow-left')}"></svg>Back to Dashboard</a></div>
  <div class="page-head"><div><h1>Change password</h1><p>Use at least 10 characters.</p></div></div>
  <form th:action="@{/account/password}" method="post" class="card">
    <div class="form-section">
      <div class="mb-3"><label class="form-label">Current password</label><input class="form-control" type="password" name="current" required autocomplete="current-password"></div>
      <div class="mb-3"><label class="form-label">New password</label><input class="form-control" type="password" name="next" required minlength="10" autocomplete="new-password"></div>
      <div><label class="form-label">Confirm new password</label><input class="form-control" type="password" name="confirm" required minlength="10" autocomplete="new-password"></div>
    </div>
    <div class="form-actions"><a class="btn btn-light" th:href="@{/}">Cancel</a><button class="btn btn-primary">Change password</button></div>
  </form>
</main>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
