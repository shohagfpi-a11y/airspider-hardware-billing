spring:
  application:
    name: hardware-billing
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hardware_billing}
    username: ${DB_USER:hardware}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 6MB
  thymeleaf:
    cache: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  forward-headers-strategy: ${FORWARD_HEADERS:framework}   # set FORWARD_HEADERS=none if the app is ever reachable without the nginx proxy
  servlet:
    session:
      timeout: 60m
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  upload-dir: ${UPLOAD_DIR:./data/uploads}
  # Optional. If empty, a random one-time token is generated and printed once at startup
  # while no administrator exists yet.
  setup-token: ${SETUP_TOKEN:}
  login:
    max-failures: 5
    lock-minutes: 15

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
